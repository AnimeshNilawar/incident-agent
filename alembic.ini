# Alembic configuration for the Micuppa Incident Agent.
#
# The database URL is intentionally left blank. It is resolved at runtime by
# migrations/env.py from the application settings (DATABASE_URL) or from an
# override supplied on the Alembic Config object (used by the integration
# tests). This keeps credentials out of source control.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is resolved in migrations/env.py; leave it blank here so no
# credentials are ever committed.
sqlalchemy.url =

# Logging configuration consumed by migrations/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
