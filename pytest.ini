[pytest]
# Put the repository root on sys.path so import app works from any test
# directory without needing PYTHONPATH set by hand.
pythonpath = .

markers =
    postgres_integration: requires an explicitly configured local PostgreSQL test database (POSTGRES_TEST_DATABASE_URL); skipped otherwise
    hosted_integration: opt-in test that writes to the dedicated Incident Agent database (requires INCIDENT_AGENT_HOSTED_TEST_DATABASE_URL and the exact confirmation ALLOW value); skipped by default and must never run in CI or normal pytest runs
